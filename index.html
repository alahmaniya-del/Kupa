.home .logo{margin:8px auto 2px!important;width:min(62%,260px)}
.is-home .tabs{display:none}
.is-home .app{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.homegear.end{inset-inline-start:auto;inset-inline-end:0}
.homegear{position:absolute;top:14px;inset-inline-start:0;width:42px;height:42px;border-radius:50%;border:0;background:rgba(199,194,181,.14);color:var(--st);display:grid;place-items:center}
.homegear svg{width:22px;height:22px}
.home{position:relative}
.clockbar{background:transparent;color:var(--st);padding:4px 0 6px;letter-spacing:.01em;font-family:var(--f-body)!important;font-weight:800!important;display:flex;justify-content:center;align-items:center;gap:10px;font-family:var(--f-display);font-weight:600;font-size:1.05rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.clockbar .sep{opacity:.35}
.clockbar .t{font-weight:700;font-size:1.25rem;direction:ltr}
@media (max-width:380px){.clockbar{font-size:.92rem;gap:6px}.clockbar .t{font-size:1.1rem}}
.home{display:flex;flex-direction:column;gap:12px;padding-top:62px}
.clocktile{background:var(--st);color:var(--g);border-radius:22px;padding:18px 20px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.clocktile .time{font-family:var(--f-display);font-size:3.2rem;font-weight:700;line-height:.95;font-variant-numeric:tabular-nums;direction:ltr}
.clocktile .dt{display:flex;flex-direction:column;gap:2px;text-align:right}
.clocktile .dt b{font-size:1.05rem}
.clocktile .dt span{font-size:.88rem;opacity:.72;font-weight:600}
.clocktile .brandline{font-family:var(--f-display);font-size:.78rem;letter-spacing:.08em;font-weight:700;opacity:.7}
.home .tiles{gap:12px;margin-top:22px}
.home .tile{background:var(--st);color:var(--g);border:0;border-radius:22px;min-height:0;aspect-ratio:1/0.92;padding:14px}
.home .tile.alert{box-shadow:none}
.home .tile.big{position:relative;overflow:hidden;justify-content:center;align-items:center;text-align:center}
.home .tile.big h3{position:relative;font-size:1.9rem;line-height:1.1;font-weight:400;letter-spacing:0;-webkit-text-stroke:1.1px currentColor;paint-order:stroke fill}
.home .tile.big h3 .zbig{display:block;font-family:"Varela Round",var(--f-display);font-size:5.4rem;font-weight:400;line-height:.85;letter-spacing:0;-webkit-text-stroke:4.5px currentColor}
.home .tile.big .zwm{font-family:"Varela Round",var(--f-display);font-size:9rem;line-height:1;-webkit-text-stroke:5px currentColor;opacity:.12}
.home .tile.big{padding-bottom:30px}
.home .tile.big .tfoot{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-weight:800;font-size:.85rem;opacity:.75;font-variant-numeric:tabular-nums}
.home .tile.big .tfoot .cur{font-size:.85em;font-weight:600}
.home .tile.big .pill{position:relative;align-self:center;margin-top:6px}
.home .tile.big .wm{position:absolute;inset:8%;width:auto;height:auto;color:var(--g);opacity:.12;pointer-events:none;display:grid;place-items:center}
.home .tile.big .wm svg{width:100%;height:100%}
.home .tile .ic{background:rgba(28,50,42,.12);color:var(--g)}
.home .tile .pill.warn{background:var(--g);color:var(--st);font-weight:800}
.home .tile .pill.ok{background:var(--g);color:var(--st)}
.home .tile .pill.none{background:rgba(28,50,42,.1);color:var(--g)}
.home .banner.info{background:var(--st);color:var(--g);border:0}
.home .btn{background:var(--g);color:var(--st)}
.home .linkrow button{color:var(--st)}
.home .tile:focus-visible,.home button:focus-visible{outline:2px solid var(--st);outline-offset:3px}
.zf{position:fixed;inset:0;z-index:40;background:var(--g);color:var(--st);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));text-align:center;font-family:var(--f-body)}
.zf .shot{position:relative;width:min(74vw,320px);aspect-ratio:3/4;border-radius:18px;overflow:hidden;background:#13241d;box-shadow:0 0 0 1px rgba(199,194,181,.25)}
.zf .shot img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.6) brightness(.9)}
.zf .beam{position:absolute;left:0;right:0;height:22%;top:-22%;background:linear-gradient(180deg,transparent,rgba(199,194,181,.55));border-bottom:2px solid var(--st);animation:zscan 1.8s ease-in-out infinite}
.zf .corner{position:absolute;width:26px;height:26px;border:3px solid var(--st)}
.zf .corner.c1{top:10px;right:10px;border-left:0;border-bottom:0;border-radius:0 8px 0 0}.zf .corner.c2{top:10px;left:10px;border-right:0;border-bottom:0;border-radius:8px 0 0 0}
.zf .corner.c3{bottom:10px;right:10px;border-left:0;border-top:0;border-radius:0 0 8px 0}.zf .corner.c4{bottom:10px;left:10px;border-right:0;border-top:0;border-radius:0 0 0 8px}
@keyframes zscan{0%{top:-22%}50%{top:100%}100%{top:-22%}}
@media (prefers-reduced-motion:reduce){.zf .beam{animation:none;top:40%}}
.zf .lbl{font-size:1.2rem;font-weight:700;letter-spacing:.01em}
.zf .q{font-size:1.3rem;font-weight:700;opacity:.9}
.zf .big{font-family:var(--f-display);font-size:3.4rem;font-weight:400;-webkit-text-stroke:1.5px currentColor;line-height:1;direction:ltr;font-variant-numeric:tabular-nums}
.zf .zin{font-family:var(--f-display);font-size:2.6rem;font-weight:400;text-align:center;direction:ltr;background:transparent;color:var(--st);border:0;border-bottom:2px solid var(--st);border-radius:0;width:min(70vw,280px);padding:6px}
.zf .zin::placeholder{color:rgba(199,194,181,.4)}
.zf .ok{border:0;background:var(--st);color:var(--g);font-family:var(--f-display);font-weight:400;font-size:1.2rem;border-radius:16px;padding:16px 0;width:min(80vw,320px)}
.zf .lnk{border:0;background:transparent;color:var(--st);opacity:.8;font-weight:700;text-decoration:underline;text-underline-offset:4px;padding:6px}
.zf .zfull{width:100%;max-width:520px;flex:1;min-height:0;object-fit:contain;border-radius:14px}
.cur{font-family:var(--f-body);font-weight:500;-webkit-text-stroke:0;font-size:.82em;margin-inline-end:.06em}
.zf{overflow-y:auto}
.zf.up{justify-content:flex-start;padding-top:calc(7vh + env(safe-area-inset-top,0px));gap:16px}
.zf .amtrow{display:flex;align-items:baseline;justify-content:center;direction:ltr;gap:6px;padding-block:4px 2px;border-bottom:2px solid rgba(28,50,42,.25);margin-inline:auto;min-width:60%}
.zf .amtrow .cur{font-size:1.5rem;color:var(--g);font-weight:400;opacity:.7}
.zf .amtrow input{width:1.2ch;max-width:220px;flex:none;text-align:left}
.zf .egrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(80vw,320px)}
.zf .egrid button{border:2px solid var(--st);background:var(--st);color:var(--g);border-radius:16px;padding:14px 4px;font-family:var(--f-display);font-size:1.12rem;line-height:1.15}
.zf .egrid button[aria-pressed="true"]{background:var(--g);color:var(--st)}
.zf .oth{font-family:var(--f-body);font-weight:700;font-size:1.15rem;text-align:center;background:var(--st);border:0;border-radius:16px;padding:14px;color:var(--g);width:min(80vw,320px)}
.zf .oth::placeholder{color:rgba(28,50,42,.5)}
.zf .zbox{background:var(--st);color:var(--g);border-radius:20px;width:min(80vw,320px);padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;text-align:center}

<script>
document.documentElement.lang='he';
const BRANCHES={rishon:'ראשון לציון',jerusalem:'ירושלים'};
const ACCT={rishon:'הלחמניא ראשל״צ',jerusalem:'הלחמניא ירושלים'};const ACCT_S={rishon:'ראשל״צ',jerusalem:'ירושלים'};const ACCT_PIN='1209';
const TYPES={
  z:{label:'Z יומי',long:'הכנסת מזומן לפי Z',sign:1,ref:'מספר Z'},
  deposit:{label:'הפקדה',long:'הפקדה לבנק',sign:-1,ref:'אסמכתא / מספר שובר'},
  advance:{label:'מפרעת עובד',long:'מפרעה לעובד',sign:-1,emp:true},
  owner:{label:'מפרעת בעלים',long:'מפרעת בעלים',sign:-1},
  expense:{label:'הוצאה',long:'הוצאה מהקופה',sign:-1,ref:'ספק / חשבונית'},
  repay:{label:'החזר מפרעה',long:'עובד החזיר מזומן',sign:1,emp:true},
  offset:{label:'קיזוז משכורת',long:'מפרעה קוזזה מהמשכורת',sign:0,emp:true},
  savings:{label:'העברה לחיסכון',long:'העברה לחיסכון',sign:-1},
  change:{label:'העברה לקופת עודף',long:'העברה לקופת עודף',sign:-1},
  salary:{label:'משכורת',long:'תשלום משכורת',sign:-1,emp:true},
  w:{label:'W',long:'הכנסת W',sign:1},
  changeback:{label:'החזרה מקופת עודף',long:'החזרה מקופת עודף לקופה',sign:1},
  vault:{label:'הפקדה לחיסכון',long:'הפקדה לחיסכון',sign:0},
  vaultout:{label:'משיכה מהפיקדון',long:'משיכה מהפיקדון',sign:0},
  adjust:{label:'התאמת ספירה',long:'התאמת יתרה לספירה',sign:null}
};
const TABS=[['home','בית'],['emps','עובדים'],['month','דוחות'],['settings','הגדרות']];
const S={branch:'rishon',tab:'home',date:today(),month:today().slice(0,7),monthBranch:'rishon',
  days:new Map(),employees:[],settings:{opening:{},alert:5000},loaded:false,slow:false,readOnly:false,db:null,noDb:false};

function pad(n){return String(n).padStart(2,'0')}
function today(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function addDays(s,n){const [y,m,d]=s.split('-').map(Number);const t=new Date(y,m-1,d+n);return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate())}
function addMonths(s,n){const [y,m]=s.split('-').map(Number);const t=new Date(y,m-1+n,1);return t.getFullYear()+'-'+pad(t.getMonth()+1)}
function dayDiff(a,b){const p=s=>{const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)};return Math.round((p(b)-p(a))/864e5)}
function hDate(s,o){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('he-IL',o||{weekday:'long',day:'numeric',month:'long'})}
function hMonth(s){const [y,m]=s.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('he-IL',{month:'long',year:'numeric'})}
const nf=new Intl.NumberFormat('he-IL',{maximumFractionDigits:2});
function ils(n,signed){const v=Math.round((n||0)*100)/100;const s=nf.format(Math.abs(v));const sg=v<0?'−':(signed&&v>0?'+':'');return '<span class="num">'+sg+'<span class="cur">₪</span>'+s+'</span>'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function parseAmt(v){const n=parseFloat(String(v||'').replace(/[,\s₪]/g,'').replace('−','-'));return isFinite(n)?n:NaN}
/* ---------- Z from e-mail: settings read by the daily scheduled task; time and on/off also set the task itself ---------- */
// one scheduled task per branch; each branch has its own sender, time and alert address
const MAILZ_DEF={rishon:{on:true,time:'22:30'},jerusalem:{on:true,time:'05:47'}};
function mailCfg(b){const m=(S.settings&&S.settings.mailz)||{};return {...(MAILZ_DEF[b]||MAILZ_DEF.rishon),...(m[b]||{})}}
function mailSave(b){const on=document.getElementById('mzOn').checked;
  const all={...((S.settings&&S.settings.mailz)||{})};all[b]={...(all[b]||{}),on};
  S.settings={...S.settings,mailz:all};saveSettings();render();setTimeout(()=>{const m=document.getElementById('mzMsg');if(m)m.textContent=on?'נשמר ✓ המשיכה מהמייל פעילה':'נשמר ✓ המשיכה מהמייל כבויה'},30)}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}

/* ---------- ledger math ---------- */
function cashOf(e){if(e.type==='adjust')return +e.amount||0;if(e.type==='vaultout')return e.to==='cash'?+e.amount||0:0;return (TYPES[e.type]?.sign||0)*(+e.amount||0)}
function key(b,d){return b+'_'+d}
function getDay(b,d){return S.days.get(key(b,d))||{branch:b,date:d,entries:[],count:null}}
function dayNet(d){return d.entries.reduce((s,e)=>s+cashOf(e),0)}
function opening(b){const o=S.settings.opening?.[b];return o&&o.date?o:{date:'',amount:0}}
function sortedDays(b){return [...S.days.values()].filter(d=>d.branch===b).sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:0)}
function balanceBefore(b,date){const o=opening(b);let bal=+o.amount||0;for(const d of sortedDays(b)){if(d.date>=date)break;if(o.date&&d.date<o.date)continue;bal+=dayNet(d)}return bal}
function closing(b,date){const d=getDay(b,date);const o=opening(b);if(o.date&&date<o.date)return dayNet(d);return balanceBefore(b,date)+dayNet(d)}
function empDebt(id){let s=0;for(const d of S.days.values())for(const e of d.entries){if(e.empId!==id)continue;if(e.type==='advance')s+=+e.amount;else if(e.type==='repay'||e.type==='offset')s-=+e.amount}return s}
function empEntries(id){const out=[];for(const d of S.days.values())for(const e of d.entries)if(e.empId===id)out.push({...e,date:d.date,branch:d.branch});return out.sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(a.at<b.at?1:-1))}
function empName(id){if(String(id).startsWith('n:'))return id.slice(2);return S.employees.find(e=>e.id===id)?.name||'עובד שנמחק'}
function lastDeposit(b,upTo){let last=null;for(const d of sortedDays(b)){if(d.date>upTo)break;if(d.entries.some(e=>e.type==='deposit'))last=d.date}return last}

/* ---------- storage: Firebase Realtime Database (REST + live stream) ---------- */
const FB_BASE='https://halechmania-orders-default-rtdb.europe-west1.firebasedatabase.app/shops/halechmania-kupa';
const PHOTO_BASE=FB_BASE+'-photos';
const FB={tree:{},es:null,poll:null};
function fbUrl(p){return FB_BASE+(p?'/'+p:'')+'.json'}
function fbSetAt(p,v){const parts=p.split('/').filter(Boolean);if(!parts.length){FB.tree=v&&typeof v==='object'?v:{};return}
  let o=FB.tree;for(let i=0;i<parts.length-1;i++){if(!o[parts[i]]||typeof o[parts[i]]!=='object')o[parts[i]]={};o=o[parts[i]]}
  const k=parts[parts.length-1];if(v===null)delete o[k];else o[k]=v}

function fbApply(){const t=FB.tree||{},days=t.days||{},cfg=t.config||{};
  const m=new Map();for(const id of Object.keys(days)){const v=days[id];if(v&&v.branch&&v.date)m.set(key(v.branch,v.date),{branch:v.branch,date:v.date,entries:arr(v.entries).filter(Boolean).map(x=>({...x})),count:v.count?{...v.count}:null})}
  S.days=m;
  const em=cfg.employees;S.employees=em?arr(em.list).filter(Boolean).map(x=>({...x})):[];
  const st=cfg.settings;if(st)S.settings={...JSON.parse(JSON.stringify(st)),opening:JSON.parse(JSON.stringify(st.opening||{})),alert:st.alert??5000};
}
const chains={};
function persist(path,body){

  chains[path]=(chains[path]||Promise.resolve()).then(async()=>{const r=await fetch(fbUrl(path),{method:'PUT',body:JSON.stringify(clean)});if(!r.ok)throw {status:r.status}}).catch(err=>{
    if(err&&(err.status===401||err.status===403))toast('אין הרשאת כתיבה למסד הנתונים');

}

async function fbLoad(){const r=await fetch(fbUrl(''),{cache:'no-store'});if(!r.ok)throw {status:r.status};FB.tree=(await r.json())||{};fbApply()}
function fbStream(){
  if(!window.EventSource){FB.poll=setInterval(()=>fbLoad().then(render).catch(()=>{}),30000);return}
  try{FB.es&&FB.es.close()}catch(e){}
  const es=new EventSource(fbUrl(''));FB.es=es;
  const on=ev=>{try{const d=JSON.parse(ev.data);if(!d)return;
      if(ev.type==='put')fbSetAt(d.path,d.data);
      else for(const k of Object.keys(d.data||{}))fbSetAt((d.path==='/'?'':d.path)+'/'+k,d.data[k]);
      fbApply();S.loaded=true;render()}catch(e){}};
  es.addEventListener('put',on);es.addEventListener('patch',on);
  es.addEventListener('cancel',()=>{es.close();FB.poll=FB.poll||setInterval(()=>fbLoad().then(render).catch(()=>{}),30000)});
  es.onerror=()=>{if(es.readyState===2){FB.poll=FB.poll||setInterval(()=>fbLoad().then(render).catch(()=>{}),30000)}};
}

  h+=`</tbody>${rows.length?`<tfoot><tr><td>סה״כ</td><td>${ils(tot.z)}</td><td>${ils(tot.deposit)}</td><td>${ils(tot.advance)}</td><td>${ils(tot.owner)}</td><td>${ils(tot.expense)}</td><td></td><td></td><td></td></tr></tfoot>`:''}</table></div></section>`;
  const ids=Object.keys(emp);

function zSeries(b,mode){const byDay={};for(const d of S.days.values())if(d.branch===b)for(const e of d.entries)if(e.type==='z')byDay[d.date]=(byDay[d.date]||0)+(+e.amount||0);
  const t=today(),[ty,tm,td]=t.split('-').map(Number),base=new Date(ty,tm-1,td),out=[];
  const ds=x=>x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate());
  if(mode==='day'){for(let i=13;i>=0;i--){const x=new Date(ty,tm-1,td-i);const k=ds(x);out.push({l:pad(x.getDate()),v:byDay[k]||0,cur:i===0})}}
  else if(mode==='week'){const sun=new Date(ty,tm-1,td-base.getDay());for(let i=7;i>=0;i--){const st=new Date(sun.getFullYear(),sun.getMonth(),sun.getDate()-7*i);let v=0;for(let j=0;j<7;j++){const x=new Date(st.getFullYear(),st.getMonth(),st.getDate()+j);v+=byDay[ds(x)]||0}out.push({l:pad(st.getDate())+'/'+pad(st.getMonth()+1),v,cur:i===0})}}
  else{for(let i=5;i>=0;i--){const x=new Date(ty,tm-1-i,1);const k=x.getFullYear()+'-'+pad(x.getMonth()+1);let v=0;for(const [dk,dv] of Object.entries(byDay))if(dk.startsWith(k))v+=dv;out.push({l:x.toLocaleDateString('he-IL',{month:'short'}),v,cur:i===0})}}
  return out}
function chartHTML(){const mode=S.chartMode||'day',b=S.branch,ser=zSeries(b,mode),mx=Math.max(1,...ser.map(x=>x.v)),tot=ser.reduce((t,x)=>t+x.v,0),cnt=ser.filter(x=>x.v>0).length;
  const nm={day:'ימים',week:'שבועות',month:'חודשים'};const k=v=>v>=1000?(Math.round(v/100)/10)+'K':Math.round(v);
  return `<section class="count zch"><div class="line"><h2 style="font-size:1rem">גרף סיכום מזומן · ${ACCT[b]||''}</h2></div>
  <div class="seg zseg" role="group" aria-label="תקופה">${Object.entries(nm).map(([m,l])=>`<button data-act="chart" data-v="${m}" aria-pressed="${mode===m}">${l}</button>`).join('')}</div>
  <div class="zbars m-${mode}">${ser.map((x,i)=>`<div class="zb${x.cur?' cur':''}"><span class="zv">${x.v?k(x.v):''}</span><span class="zcol"><i style="height:${Math.round(x.v/mx*100)}%;animation-delay:${i*45}ms"></i></span><span class="zl">${x.l}</span></div>`).join('')}</div>
  <div class="line muted"><span>סה״כ ${nm[mode]==='ימים'?'14 ימים':nm[mode]==='שבועות'?'8 שבועות':'6 חודשים'}: <b>${ils(tot)}</b></span><span>ממוצע: <b>${ils(cnt?tot/cnt:0)}</b></span></div></section>`}

function openSheet(html){document.getElementById('sheetRoot').innerHTML=`<div class="sheet-wrap" data-act="closeBg" dir="rtl"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;const f=document.querySelector('.sheet input.amt,.sheet input');f&&setTimeout(()=>f.focus(),60)}

function drawEntry(){
  const t=TYPES[F.type];const emps=S.employees.filter(e=>!e.deleted&&(e.branch===F.branch||e.branch==='both')&&(e.active!==false||e.id===F.empId));

    else h+=`<div class="inrow"><label class="filebtn" for="fCam">צלם Z</label><label class="filebtn" for="fGal">מהגלריה</label></div>`;

  if(t.ref)h+=`<div class="field"><label for="fRef">${t.ref}</label><input id="fRef" value="${esc(F.ref)}"></div>`;
  h+=`<div class="field"><label for="fNote">הערה</label><input id="fNote" value="${esc(F.note)}" placeholder="לא חובה"></div>`;
  h+=F.lock&&!F.editing?`<div class="field"><label for="fDate">תאריך</label><input type="date" id="fDate" value="${F.date}"></div>`:`<div class="grid2"><div class="field"><label for="fDate">תאריך</label><input type="date" id="fDate" value="${F.date}"></div><div class="field"><label for="fBr">סניף</label><select id="fBr">${Object.entries(BRANCHES).map(([k,v])=>`<option value="${k}" ${k===F.branch?'selected':''}>${v}</option>`).join('')}</select></div></div>`;

function readEntryForm(){const g=id=>document.getElementById(id);F.amount=g('fAmt')?.value??F.amount;F.empId=g('fEmp')?.value??F.empId;if(g('fEmp')&&F.empId==='__other'&&String(F.prevEmp||'').startsWith('n:'))F.empId=F.prevEmp;F.other=g('fOther')?.value??F.other;F.ref=g('fRef')?.value??F.ref;F.note=g('fNote')?.value??F.note;F.date=g('fDate')?.value||F.date;F.branch=g('fBr')?.value||F.branch}
function saveEntry(){
  readEntryForm();const a=parseAmt(F.amount),err=document.getElementById('fErr');
  const bad=m=>{err.textContent=m;err.hidden=false};
  if(!isFinite(a)||(F.type!=='adjust'&&a<=0))return bad('הכנס סכום גדול מאפס');
  if(['advance','owner','deposit','expense'].includes(F.type)){let bal=cashNow(F.branch);if(F.editing){const od=getDay(F.editing.branch,F.editing.date).entries.find(x=>x.id===F.editing.id);if(od&&F.editing.branch===F.branch)bal-=cashOf(od)}if(a>Math.round((bal-CASH_FLOOR)*100)/100+0.001)return bad(`אפשר להיכנס למינוס עד ${limTxt()} בלבד`)}
  {let after=cashNow(F.branch);if(F.editing){const od=getDay(F.editing.branch,F.editing.date).entries.find(x=>x.id===F.editing.id);if(od)after-=cashOf(od)}after+=cashOf({type:F.type,amount:a});if(after<CASH_FLOOR-0.001)return bad('השינוי יוריד את היתרה למינוס')}
  if(TYPES[F.type].emp&&!F.empId)return bad('בחר עובד');
  if(F.empId==='__other'||String(F.empId).startsWith('n:')){const nm=(F.other||'').trim();if(!nm)return bad('כתוב את שם העובד');F.empId='n:'+nm}
  const e={id:F.editing?.id||uid(),type:F.type,amount:Math.round(a*100)/100,at:F.editing?.at||new Date().toISOString()};
  if(TYPES[F.type].emp)e.empId=F.empId;if(F.type==='z'&&F.photo)e.photo=F.photo;if(F.photoBusy)return bad('המתן לסיום העלאת הצילום');if(F.ref.trim())e.ref=F.ref.trim();if(F.note.trim())e.note=F.note.trim();
  if(F.editing){const old=getDay(F.editing.branch,F.editing.date);if(F.editing.branch!==F.branch||F.editing.date!==F.date){saveDay({...old,entries:old.entries.filter(x=>x.id!==e.id)})}}
  const day=getDay(F.branch,F.date);const entries=day.entries.filter(x=>x.id!==e.id);entries.push(e);saveDay({...day,entries});
  closeSheet();toast(F.editing?'נשמר':TYPES[e.type].label+' נרשם');render();
}
function deleteEntry(){const d=getDay(F.editing.branch,F.editing.date);{const ent=d.entries.find(x=>x.id===F.editing.id);const v=ent?cashOf(ent):0;if(v>0&&cashNow(F.editing.branch)-v<CASH_FLOOR-0.001){toast(`אי אפשר למחוק: היתרה תרד מתחת למינוס ${limTxt()}`);return}}saveDay({...d,entries:d.entries.filter(x=>x.id!==F.editing.id)});closeSheet();toast('נמחק');render()}
